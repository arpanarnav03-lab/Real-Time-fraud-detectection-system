<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fraud Detection Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const API_BASE = "http://localhost:8000";

const RISK_STYLES = {
  high:   { dot: "bg-rose-500",   text: "text-rose-400",   bg: "bg-rose-500/10 border-rose-500/30" },
  medium: { dot: "bg-amber-500",  text: "text-amber-400",  bg: "bg-amber-500/10 border-amber-500/30" },
  low:    { dot: "bg-emerald-500",text: "text-emerald-400",bg: "bg-emerald-500/10 border-emerald-500/30" },
};

function StatCard({ label, value, accent }) {
  return (
    <div className="bg-slate-900 border border-slate-800 rounded-xl px-5 py-4">
      <div className="text-xs uppercase tracking-wide text-slate-500">{label}</div>
      <div className={`text-2xl font-semibold mt-1 ${accent || "text-slate-100"}`}>{value}</div>
    </div>
  );
}

function TransactionRow({ txn, onExpand, expanded, onStatusChange, highlight }) {
  const risk = RISK_STYLES[txn.risk_level] || RISK_STYLES.low;
  return (
    <>
      <tr
        onClick={() => onExpand(txn.id)}
        className={`border-b border-slate-800 cursor-pointer transition ${
          highlight ? "bg-indigo-500/15 ring-1 ring-inset ring-indigo-400 animate-pulse" : "hover:bg-slate-900/60"
        }`}
      >
        <td className="py-3 px-4 text-slate-400 text-sm">#{txn.id}</td>
        <td className="py-3 px-4">
          <span className={`inline-flex items-center gap-2 text-sm font-medium ${risk.text}`}>
            <span className={`w-2 h-2 rounded-full ${risk.dot}`}></span>
            {txn.risk_level.toUpperCase()}
          </span>
        </td>
        <td className="py-3 px-4 text-sm">{(txn.fraud_probability * 100).toFixed(1)}%</td>
        <td className="py-3 px-4 text-sm">₹{Number(txn.loan_amount).toLocaleString(undefined, {maximumFractionDigits:0})}</td>
        <td className="py-3 px-4 text-sm text-slate-400">{txn.distance_from_home.toFixed(0)} km</td>
        <td className="py-3 px-4">
          <span className="text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-300 capitalize">{txn.status}</span>
        </td>
        <td className="py-3 px-4 text-sm text-slate-500">{txn.recommended_action.replace("_", " ")}</td>
      </tr>
      {expanded && (
        <tr className="border-b border-slate-800 bg-slate-900/40">
          <td colSpan="7" className="px-4 py-4">
            <div className={`rounded-lg border p-4 ${risk.bg}`}>
              <div className="text-sm text-slate-200 mb-3">{txn.explanation}</div>
              <div className="text-xs text-slate-500 mb-3">
                Explanation source: {txn.source === "llm" ? "Claude (LLM)" : "rule-based fallback"}
              </div>
              {txn.similar_cases && txn.similar_cases.length > 0 && (
                <div className="mb-3">
                  <div className="text-xs uppercase tracking-wide text-slate-500 mb-1">Similar past cases</div>
                  <ul className="text-xs text-slate-400 space-y-0.5">
                    {txn.similar_cases.map((c) => (
                      <li key={c.transaction_id}>
                        #{c.transaction_id} — {c.risk_level} risk ({(c.fraud_probability * 100).toFixed(1)}%),
                        {" "}₹{Number(c.loan_amount).toLocaleString(undefined, {maximumFractionDigits: 0})}
                      </li>
                    ))}
                  </ul>
                </div>
              )}
              <div className="flex gap-2">
                <button
                  onClick={(e) => { e.stopPropagation(); onStatusChange(txn.id, "cleared"); }}
                  className="px-3 py-1.5 text-xs rounded-md bg-emerald-600 hover:bg-emerald-500 transition"
                >Clear</button>
                <button
                  onClick={(e) => { e.stopPropagation(); onStatusChange(txn.id, "flagged"); }}
                  className="px-3 py-1.5 text-xs rounded-md bg-rose-600 hover:bg-rose-500 transition"
                >Flag</button>
              </div>
            </div>
          </td>
        </tr>
      )}
    </>
  );
}

function NumberField({ label, suffix, value, onChange, min, max, step = "any" }) {
  return (
    <label className="block">
      <span className="block text-xs text-slate-500 mb-1">{label}{suffix ? ` (${suffix})` : ""}</span>
      <input
        type="number"
        required
        min={min}
        max={max}
        step={step}
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
      />
    </label>
  );
}

function ToggleField({ label, checked, onChange }) {
  return (
    <label className="flex items-center justify-between gap-3 bg-slate-800 border border-slate-700 rounded-md px-3 py-2 cursor-pointer select-none">
      <span className="text-sm text-slate-300">{label}</span>
      <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} className="sr-only" />
      <span className={`w-9 h-5 rounded-full transition relative shrink-0 ${checked ? "bg-indigo-600" : "bg-slate-600"}`}>
        <span className={`absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white transition-transform ${checked ? "translate-x-4" : ""}`}></span>
      </span>
    </label>
  );
}

// Realistic pre-fills so a demo doesn't require typing all 9 fields by hand.
const PRESETS = {
  suspicious: {
    loan_amount: "75000",
    distance_from_home: "250",
    distance_from_last_transaction: "180",
    ratio_to_median_purchase: "6.5",
    hour_of_day: "3",
    repeat_borrower: false,
    used_chip_or_biometric: false,
    used_pin_or_otp: false,
    is_online_channel: true,
  },
  normal: {
    loan_amount: "5000",
    distance_from_home: "8",
    distance_from_last_transaction: "3",
    ratio_to_median_purchase: "1.0",
    hour_of_day: "14",
    repeat_borrower: true,
    used_chip_or_biometric: true,
    used_pin_or_otp: true,
    is_online_channel: false,
  },
};

const EMPTY_FORM = {
  loan_amount: "",
  distance_from_home: "",
  distance_from_last_transaction: "",
  ratio_to_median_purchase: "",
  hour_of_day: "",
  repeat_borrower: false,
  used_chip_or_biometric: false,
  used_pin_or_otp: false,
  is_online_channel: false,
};

function NewTransactionPanel({ onSubmit, submitting }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState(EMPTY_FORM);

  const setField = (name) => (value) => setForm((f) => ({ ...f, [name]: value }));

  const handleSubmit = async (e) => {
    e.preventDefault();
    const ok = await onSubmit({
      loan_amount: Number(form.loan_amount),
      distance_from_home: Number(form.distance_from_home),
      distance_from_last_transaction: Number(form.distance_from_last_transaction),
      ratio_to_median_purchase: Number(form.ratio_to_median_purchase),
      hour_of_day: Number(form.hour_of_day),
      repeat_borrower: form.repeat_borrower ? 1 : 0,
      used_chip_or_biometric: form.used_chip_or_biometric ? 1 : 0,
      used_pin_or_otp: form.used_pin_or_otp ? 1 : 0,
      is_online_channel: form.is_online_channel ? 1 : 0,
    });
    if (ok) {
      setForm(EMPTY_FORM);
      setOpen(false);
    }
  };

  return (
    <div className="bg-slate-900 border border-slate-800 rounded-xl mb-6 overflow-hidden">
      <button
        type="button"
        onClick={() => setOpen((o) => !o)}
        className="w-full flex items-center justify-between px-5 py-4 text-sm font-medium hover:bg-slate-800/50 transition"
      >
        <span>+ New Transaction</span>
        <span className="text-slate-500 text-xs">{open ? "Hide ▲" : "Show ▼"}</span>
      </button>
      {open && (
        <form onSubmit={handleSubmit} className="px-5 pb-5 pt-1 border-t border-slate-800">
          <div className="flex gap-2 mb-4 mt-4">
            <button
              type="button"
              onClick={() => setForm(PRESETS.suspicious)}
              className="px-3 py-1.5 text-xs rounded-md bg-rose-600/20 text-rose-300 border border-rose-600/40 hover:bg-rose-600/30 transition"
            >Try a suspicious pattern</button>
            <button
              type="button"
              onClick={() => setForm(PRESETS.normal)}
              className="px-3 py-1.5 text-xs rounded-md bg-emerald-600/20 text-emerald-300 border border-emerald-600/40 hover:bg-emerald-600/30 transition"
            >Try a normal pattern</button>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
            <NumberField label="Loan amount" suffix="₹" value={form.loan_amount} onChange={setField("loan_amount")} min="1" />
            <NumberField label="Distance from home" suffix="km" value={form.distance_from_home} onChange={setField("distance_from_home")} min="0" />
            <NumberField label="Distance from last txn" suffix="km" value={form.distance_from_last_transaction} onChange={setField("distance_from_last_transaction")} min="0" />
            <NumberField label="Ratio to median purchase" value={form.ratio_to_median_purchase} onChange={setField("ratio_to_median_purchase")} min="0" />
            <NumberField label="Hour of day" suffix="0-23" value={form.hour_of_day} onChange={setField("hour_of_day")} min="0" max="23" />
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            <ToggleField label="Repeat borrower" checked={form.repeat_borrower} onChange={setField("repeat_borrower")} />
            <ToggleField label="Chip / biometric" checked={form.used_chip_or_biometric} onChange={setField("used_chip_or_biometric")} />
            <ToggleField label="PIN / OTP" checked={form.used_pin_or_otp} onChange={setField("used_pin_or_otp")} />
            <ToggleField label="Online channel" checked={form.is_online_channel} onChange={setField("is_online_channel")} />
          </div>

          <button
            type="submit"
            disabled={submitting}
            className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 transition disabled:opacity-50"
          >
            {submitting ? "Scoring…" : "Score transaction"}
          </button>
        </form>
      )}
    </div>
  );
}

function describeFetchError(e, fallback) {
  // fetch() only throws TypeError for a network-level failure (backend down,
  // wrong port, CORS). Anything else here is a response we did get, just
  // with a non-2xx status — worth telling apart so the message is honest.
  if (e instanceof TypeError) {
    return "Can't reach the backend. Make sure it's running on localhost:8000.";
  }
  return `${fallback}: ${e.message}`;
}

function App() {
  const [transactions, setTransactions] = useState([]);
  const [expandedId, setExpandedId] = useState(null);
  const [initialLoading, setInitialLoading] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [seeding, setSeeding] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [highlightId, setHighlightId] = useState(null);
  const [error, setError] = useState(null);

  const busy = refreshing || seeding;

  const fetchTransactions = async () => {
    try {
      const res = await fetch(`${API_BASE}/transactions`);
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      setTransactions(await res.json());
      setError(null);
    } catch (e) {
      setError(describeFetchError(e, "Couldn't load transactions"));
    }
  };

  useEffect(() => {
    fetchTransactions().finally(() => setInitialLoading(false));
  }, []);

  const handleRefresh = async () => {
    setRefreshing(true);
    await fetchTransactions();
    setRefreshing(false);
  };

  const seedDemoData = async () => {
    setSeeding(true);
    try {
      const res = await fetch(`${API_BASE}/seed-demo-data`, { method: "POST" });
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      await fetchTransactions();
    } catch (e) {
      setError(describeFetchError(e, "Seed failed"));
    }
    setSeeding(false);
  };

  const createTransaction = async (payload) => {
    setSubmitting(true);
    try {
      const res = await fetch(`${API_BASE}/transactions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => null);
        const detail = body && body.detail
          ? (Array.isArray(body.detail) ? body.detail.map((d) => d.msg).join("; ") : body.detail)
          : `Server responded with ${res.status}`;
        throw new Error(detail);
      }
      const created = await res.json();
      await fetchTransactions();
      setHighlightId(created.id);
      setTimeout(() => setHighlightId(null), 2500);
      setSubmitting(false);
      return true;
    } catch (e) {
      setError(describeFetchError(e, "Couldn't create transaction"));
      setSubmitting(false);
      return false;
    }
  };

  const updateStatus = async (id, status) => {
    try {
      const res = await fetch(`${API_BASE}/transactions/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status }),
      });
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      await fetchTransactions();
    } catch (e) {
      setError(describeFetchError(e, "Couldn't update status"));
    }
  };

  // While a just-created transaction is highlighted, pin it to the top
  // regardless of its natural risk-sort rank; once the highlight clears it
  // settles back into normal order on the next render.
  const orderedTransactions = highlightId
    ? [
        ...transactions.filter((t) => t.id === highlightId),
        ...transactions.filter((t) => t.id !== highlightId),
      ]
    : transactions;

  const highRisk = transactions.filter(t => t.risk_level === "high").length;
  const pending = transactions.filter(t => t.status === "pending").length;
  const avgProb = transactions.length
    ? (transactions.reduce((s, t) => s + t.fraud_probability, 0) / transactions.length * 100).toFixed(1)
    : "0";

  return (
    <div className="max-w-6xl mx-auto px-6 py-10">
      <div className="flex items-center justify-between mb-8">
        <div>
          <h1 className="text-2xl font-bold">Real-Time Fraud Detection</h1>
          <p className="text-slate-500 text-sm mt-1">Digital lending transaction monitor — ML scoring + LLM explanation</p>
        </div>
        <div className="flex gap-2">
          <button onClick={handleRefresh} disabled={busy} className="px-4 py-2 text-sm rounded-lg bg-slate-800 hover:bg-slate-700 transition disabled:opacity-50">
            {refreshing ? "Refreshing…" : "Refresh"}
          </button>
          <button onClick={seedDemoData} disabled={busy} className="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 transition disabled:opacity-50">
            {seeding ? "Loading…" : "Load Demo Transactions"}
          </button>
        </div>
      </div>

      {error && (
        <div className="mb-6 px-4 py-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm">{error}</div>
      )}

      <div className="grid grid-cols-4 gap-4 mb-8">
        <StatCard label="Total Transactions" value={transactions.length} />
        <StatCard label="High Risk" value={highRisk} accent="text-rose-400" />
        <StatCard label="Pending Review" value={pending} accent="text-amber-400" />
        <StatCard label="Avg Fraud Score" value={`${avgProb}%`} />
      </div>

      <NewTransactionPanel onSubmit={createTransaction} submitting={submitting} />

      <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
        <table className="w-full text-left">
          <thead>
            <tr className="border-b border-slate-800 text-xs uppercase tracking-wide text-slate-500">
              <th className="py-3 px-4">ID</th>
              <th className="py-3 px-4">Risk</th>
              <th className="py-3 px-4">Score</th>
              <th className="py-3 px-4">Amount</th>
              <th className="py-3 px-4">Distance</th>
              <th className="py-3 px-4">Status</th>
              <th className="py-3 px-4">Action</th>
            </tr>
          </thead>
          <tbody>
            {orderedTransactions.map(txn => (
              <TransactionRow
                key={txn.id}
                txn={txn}
                expanded={expandedId === txn.id}
                highlight={txn.id === highlightId}
                onExpand={(id) => setExpandedId(expandedId === id ? null : id)}
                onStatusChange={updateStatus}
              />
            ))}
          </tbody>
        </table>
        {initialLoading && (
          <div className="py-16 flex items-center justify-center gap-2 text-slate-500 text-sm">
            <span className="w-4 h-4 border-2 border-slate-600 border-t-slate-300 rounded-full animate-spin"></span>
            Loading transactions…
          </div>
        )}
        {!initialLoading && transactions.length === 0 && !error && (
          <div className="py-16 text-center text-slate-500 text-sm">
            No transactions yet. Click "Load Demo Transactions" to seed the dashboard.
          </div>
        )}
      </div>

      <p className="text-xs text-slate-600 mt-6">
        Click a row to see the LLM explanation and take action. Prototype scope: Postgres+pgvector (Neon), single-service
        backend. Production target: AWS Bedrock, Render/Vercel deploy — see docs/ARCHITECTURE.md.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
